<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Site em Manutenção - Click Suporte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            text-align: center;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d4ff, #0ea5e9);
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 50px rgba(0, 212, 255, 0.8);
                transform: scale(1.05);
            }
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo-accent {
            color: #00d4ff;
        }

        .icon-container {
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .maintenance-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .info-item svg {
            color: #00d4ff;
            flex-shrink: 0;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #00d4ff, #0ea5e9);
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 212, 255, 0.5);
        }

        .timer {
            font-size: 2rem;
            font-weight: 800;
            color: #00d4ff;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .maintenance-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">C</div>
            <span class="logo-text">Click<span class="logo-accent">Suporte</span></span>
        </div>

        <div class="icon-container">
            <div class="maintenance-icon">🛠️</div>
        </div>

        <h1>Site em Manutenção</h1>
        
        <p>
            Estamos realizando melhorias no sistema para oferecer<br>
            uma experiência ainda melhor para você!
        </p>

        <div class="info-box">
            <div class="info-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Previsão de retorno: <strong>Em breve</strong></span>
            </div>
            
            <div class="info-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                </svg>
                <span>Emergências: <strong>97 99139-4382</strong></span>
            </div>
        </div>

        <a href="https://wa.me/5597991394382?text=Olá!%20Vi%20que%20o%20site%20está%20em%20manutenção.%20Preciso%20de%20atendimento." class="cta-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            Falar no WhatsApp
        </a>

        <p style="margin-top: 40px; font-size: 0.9rem; color: rgba(255,255,255,0.5);">
            Obrigado pela compreensão! 🚀
        </p>
    </div>
</body>
</html>
